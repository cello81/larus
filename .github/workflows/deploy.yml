name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

# Actions sind per Commit-Hash festgeschrieben (die Version steht im Kommentar).
# Dependabot (.github/dependabot.yml) schlägt neue Versionen als Pull Request vor.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # npm ci installiert exakt den Stand aus package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Push build output to deploy branch
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: deploy
          folder: dist
          clean: true
