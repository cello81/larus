name: Sicherheitsprüfung Abhängigkeiten

# Prüft die Abhängigkeiten gegen bekannte Sicherheitslücken. Schlägt etwas an,
# schickt GitHub eine Mail über den fehlgeschlagenen Lauf (wie bei Abrakadata).
on:
  schedule:
    - cron: '23 5 * * 1'   # montags
  push:
    branches: [main]
    paths: ['package-lock.json']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: npm audit (Pakete in package-lock.json)
        run: npm audit --audit-level=moderate
